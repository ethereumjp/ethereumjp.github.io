name: GitHub Pages mirror

on:
  workflow_call:
    inputs:
      enabled:
        required: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ghpages:
    if: ${{ inputs.enabled }}
    name: Deploy GitHub Pages mirror
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: static-site
          path: dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Publish mirror
        id: deployment
        uses: actions/deploy-pages@v5
