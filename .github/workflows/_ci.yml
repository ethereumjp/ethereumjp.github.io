name: CI

on:
  workflow_call:
    inputs:
      ghpages:
        required: false
        type: boolean
        default: false
    secrets:
      VITE_AIRTABLE_NEWSLETTER_PAT:
        required: false
      VITE_AIRTABLE_NEWSLETTER_BASE:
        required: false
      VITE_AIRTABLE_NEWSLETTER_TABLE:
        required: false
      AIRTABLE_EVENTCURATE_PAT:
        required: false
      AIRTABLE_EVENTCURATE_BASE:
        required: false
      AIRTABLE_EVENTCURATE_TABLE:
        required: false
      FORMBRICKS_EVENT_PAT:
        required: false
      FORMBRICKS_EVENT_SURVEY_ID:
        required: false

permissions:
  contents: read

env:
  PNPM_VERSION: 10.25.0
  NODE_VERSION: 24.x

jobs:
  scan:
    name: basic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: lint & format
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test