name: CI

on:
  workflow_call:
    inputs:
      ghpages:
        required: false
        type: boolean
        default: false
    secrets:
      VITE_AIRTABLE_NEWSLETTER_PAT:
        required: false
      VITE_AIRTABLE_NEWSLETTER_BASE:
        required: false
      VITE_AIRTABLE_NEWSLETTER_TABLE:
        required: false
      AIRTABLE_EVENTCURATE_PAT:
        required: false
      AIRTABLE_EVENTCURATE_BASE:
        required: false
      AIRTABLE_EVENTCURATE_TABLE:
        required: false
      FORMBRICKS_EVENT_PAT:
        required: false
      FORMBRICKS_EVENT_SURVEY_ID:
        required: false

permissions:
  contents: read

env:
  PNPM_VERSION: 10.25.0
  NODE_VERSION: 24.x

jobs:
  scan:
    name: basic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm exec tsc --noEmit
      - name: lint & format
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Static build
    needs: [scan, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build
        env:
          DO_NOT_TRACK: 1
          VITE_AIRTABLE_NEWSLETTER_PAT: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_PAT }}
          VITE_AIRTABLE_NEWSLETTER_BASE: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_BASE }}
          VITE_AIRTABLE_NEWSLETTER_TABLE: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_TABLE }}
          AIRTABLE_EVENTCURATE_PAT: ${{ secrets.AIRTABLE_EVENTCURATE_PAT }}
          AIRTABLE_EVENTCURATE_BASE: ${{ secrets.AIRTABLE_EVENTCURATE_BASE }}
          AIRTABLE_EVENTCURATE_TABLE: ${{ secrets.AIRTABLE_EVENTCURATE_TABLE }}
          FORMBRICKS_EVENT_PAT: ${{ secrets.FORMBRICKS_EVENT_PAT }}
          FORMBRICKS_EVENT_SURVEY_ID: ${{ secrets.FORMBRICKS_EVENT_SURVEY_ID }}
      - name: Upload static build
        if: inputs.ghpages == true
        uses: actions/upload-artifact@v5
        with:
          name: static-site
          path: dist
          if-no-files-found: error
