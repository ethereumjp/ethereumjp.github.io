on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Least privilege by default; Pages write scope is granted to the deploy job only.
permissions:
  contents: read

concurrency:
  group: "publish-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # setup
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm" # setup-node handles the pnpm store cache

      # dependencies (install always runs; the pnpm store cache above keeps it fast)
      - name: Install packages
        run: pnpm install --frozen-lockfile

      # scan
      - name: type check
        run: pnpm tsc
      - name: lint/format
        run: pnpm biome ci .

      # build (clean build every run; no dist cache to avoid stale deploys)
      - name: Build
        run: pnpm run build
        env:
          DO_NOT_TRACK: 1
          # VITE_ vars are intentionally inlined into the client bundle (read from frontend JS)
          VITE_AIRTABLE_NEWSLETTER_PAT: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_PAT }}
          VITE_AIRTABLE_NEWSLETTER_BASE: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_BASE }}
          VITE_AIRTABLE_NEWSLETTER_TABLE: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_TABLE }}
          # Build-time only (not inlined into the client bundle)
          AIRTABLE_EVENTCURATE_PAT: ${{ secrets.AIRTABLE_EVENTCURATE_PAT }}
          AIRTABLE_EVENTCURATE_BASE: ${{ secrets.AIRTABLE_EVENTCURATE_BASE }}
          AIRTABLE_EVENTCURATE_TABLE: ${{ secrets.AIRTABLE_EVENTCURATE_TABLE }}
          FORMBRICKS_EVENT_PAT: ${{ secrets.FORMBRICKS_EVENT_PAT }}
          FORMBRICKS_EVENT_SURVEY_ID: ${{ secrets.FORMBRICKS_EVENT_SURVEY_ID }}

      # upload
      - name: Upload pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    # Pages write scope is confined to this job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish to Github pages
        id: deployment
        uses: actions/deploy-pages@v5
