name: Deploy to Render

on:
  workflow_call:
    secrets:
      RENDER_API_KEY:
        required: true
      RENDER_SERVICE_ID:
        required: true

permissions:
  contents: read

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        id: render-deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"commitId\":\"${GITHUB_SHA}\"}")"

          deploy_id="$(jq -r '.id // .deploy.id // empty' <<<"${response}")"
          if [[ -n "${deploy_id}" ]]; then
            echo "comment='Render deployment accepted: ${deploy_id} (commit ${GITHUB_SHA})'" >> "$GITHUB_OUTPUT"
          else
            echo "comment='Render deployment request accepted for commit ${GITHUB_SHA}'" >> "$GITHUB_OUTPUT"
          fi
      - name: Result preview
        if: ${{ inputs.target !== 'production' }}
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.render-deploy.outputs.comment }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (!process.env.PREVIEW_URL) return;
            const { owner, repo } = context.repo;
            const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: context.sha,
            });
            const pull = associated.data.find((item) => item.state === 'open');
            if (!pull) return;
            const body = `Render Preview Link: ${process.env.PREVIEW_URL}`;
            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number: pull.number,
            });
            const existing = comments.data.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.startsWith('Render Preview Link:')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull.number, body,
              });
            }


        
