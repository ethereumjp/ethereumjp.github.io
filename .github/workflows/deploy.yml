name: Deploy

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target:
        required: true
        default: production
        type: choice
        options: [preview, production]
      mirror:
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    with:
      ghpages: ${{ inputs.mirror == true }}
    secrets: inherit

  build:
    name: Static build
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm build
        env:
          DO_NOT_TRACK: 1
          VITE_AIRTABLE_NEWSLETTER_PAT: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_PAT }}
          VITE_AIRTABLE_NEWSLETTER_BASE: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_BASE }}
          VITE_AIRTABLE_NEWSLETTER_TABLE: ${{ secrets.VITE_AIRTABLE_NEWSLETTER_TABLE }}
          AIRTABLE_EVENTCURATE_PAT: ${{ secrets.AIRTABLE_EVENTCURATE_PAT }}
          AIRTABLE_EVENTCURATE_BASE: ${{ secrets.AIRTABLE_EVENTCURATE_BASE }}
          AIRTABLE_EVENTCURATE_TABLE: ${{ secrets.AIRTABLE_EVENTCURATE_TABLE }}
          FORMBRICKS_EVENT_PAT: ${{ secrets.FORMBRICKS_EVENT_PAT }}
          FORMBRICKS_EVENT_SURVEY_ID: ${{ secrets.FORMBRICKS_EVENT_SURVEY_ID }}
      - name: Upload static build
        uses: actions/upload-artifact@v5
        with:
          name: static-site
          path: dist
          if-no-files-found: error


  deploy-vercel:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
    needs: ci
    uses: ./.github/workflows/_vercel.yml
    with:
      target: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'preview') }}
    secrets: inherit

  deploy-render:
    name: Commit mirror
    needs: ci
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/_render.yml
    secrets: inherit

  deploy-ghpages:
    name: Static mirror
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && inputs.mirror == true }}
    uses: ./.github/workflows/_ghpages.yml
    with:
      enabled: true
    secrets: inherit
